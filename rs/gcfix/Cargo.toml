[package]
name = "gcfix"
version = "0.1.0"
edition = "2024"

[dependencies]
numpy = { workspace = true }
pyo3 = { version = "0.27.2", features = ["auto-initialize"] }
rayon = "1.11.0"
anyhow = { workspace = true }
ndarray = { workspace = true }
clap = { version = "4.5.53", features = ["derive"] }
# polars = {version = "0.51.*", features = ["lazy"]}
crackle-kit = { workspace = true }

[profile.dev]
incremental = true

[profile.release]
lto = 'thin'
debug = "line-tables-only"

[profile.debug-release]
inherits = "release"
debug = true

[profile.deploy]
inherits = "release"
lto = true
codegen-units = 1
debug = false


[[bin]]
name = "gc_count"


[dev-dependencies]
criterion = "0.*"
rand = "0.9.2"
memchr = "2.7.6"

[[bench]]
name = "bench"
harness = false
